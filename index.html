<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>附近公車查詢</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #ffffff; --bg2: #f3f5f8; --text: #1d2330; --muted: #6b7385;
    --line: #dde1e8; --accent: #1a73e8; --accent-text: #ffffff; --err: #d93025;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161a22; --bg2: #1f2430; --text: #e8ebf2; --muted: #9aa3b5;
      --line: #2e3544; --accent: #5b9dff; --accent-text: #0b1220; --err: #ff6b60;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text);
  }
  #app { display: flex; flex-direction: column; height: 100dvh; }
  #map { flex: 1 1 45%; min-height: 180px; z-index: 0; }
  #panel { flex: 1 1 55%; display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--line); background: var(--bg); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; background: var(--bg2); border-bottom: 1px solid var(--line); }
  button, select, input {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); padding: 8px 12px;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .6; }
  #status { padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); min-height: 34px; }
  #status.error { color: var(--err); }
  #content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .empty { padding: 24px 16px; color: var(--muted); text-align: center; line-height: 1.7; }
  .station-h {
    position: sticky; top: 0; z-index: 1;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--bg2); border-bottom: 1px solid var(--line);
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .station-h small { color: var(--muted); font-weight: 400; white-space: nowrap; }
  .row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover, .row:active { background: var(--bg2); }
  .badge { min-width: 56px; text-align: center; background: var(--accent); color: var(--accent-text); font-weight: 700; border-radius: 8px; padding: 6px 8px; font-size: 15px; word-break: keep-all; }
  .row .mid { flex: 1; min-width: 0; }
  .row .t1 { font-size: 14px; font-weight: 600; }
  .row .t2 { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .arrow { color: var(--muted); }
  .routehead { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--bg2); border-bottom: 1px solid var(--line); }
  .routehead .info { flex: 1; min-width: 0; }
  .routehead .t1 { font-weight: 700; }
  .routehead .t2 { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stop { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .stop:hover, .stop:active { background: var(--bg2); }
  .stop.near { background: rgba(26,115,232,.14); }
  .stop .no { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-text); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .stop.near .no { background: #e8710a; color: #fff; }
  .stop .nm { flex: 1; font-size: 15px; min-width: 0; }
  .stop .nm small { display: block; color: var(--accent); font-size: 11px; }
  .num-icon { background: var(--accent); color: var(--accent-text); border: 2px solid #fff; border-radius: 50%; width: 24px; height: 24px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .num-icon.near { background: #e8710a; color: #fff; }
  .me-icon { width: 18px; height: 18px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(26,115,232,.3); }
  @media (min-width: 800px) {
    #app { flex-direction: row-reverse; }
    #map { flex: 1 1 auto; }
    #panel { flex: 0 0 420px; border-top: none; border-right: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <div class="toolbar">
      <button id="btnLocate" class="primary">📍 定位我的位置</button>
      <select id="radius" title="搜尋範圍">
        <option value="300">300 公尺</option>
        <option value="500" selected>500 公尺</option>
        <option value="800">800 公尺</option>
      </select>
    </div>
    <div id="status">按「定位我的位置」開始，或直接點地圖選擇位置。</div>
    <div id="content"><div class="empty">尚未查詢。<br>也可以點擊地圖任一位置，查詢該處附近的公車。</div></div>
  </div>
</div>

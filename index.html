<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>附近公車即時動態</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #ffffff; --bg2: #f3f5f8; --text: #1d2330; --muted: #6b7385;
    --line: #dde1e8; --accent: #1a73e8; --accent-text: #ffffff;
    --soon: #d93025; --ok: #188038; --warn: #e8710a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161a22; --bg2: #1f2430; --text: #e8ebf2; --muted: #9aa3b5;
      --line: #2e3544; --accent: #5b9dff; --accent-text: #0b1220;
      --soon: #ff6b60; --ok: #5bd17f; --warn: #ffa04d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text);
  }
  #app { display: flex; flex-direction: column; height: 100dvh; }
  #map { flex: 1 1 42%; min-height: 180px; z-index: 0; }
  #panel { flex: 1 1 58%; display: flex; flex-direction: column; min-height: 0; border-top: 1px solid var(--line); background: var(--bg); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; background: var(--bg2); border-bottom: 1px solid var(--line); }
  button, select, input {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); padding: 8px 12px;
  }
  input { width: 100%; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .6; }
  #settings { display: none; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--bg2); }
  #settings.open { display: block; }
  #settings label { display: block; font-size: 12px; color: var(--muted); margin: 6px 0 3px; }
  #settings .hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  #status { padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); min-height: 34px; }
  #status.error { color: var(--soon); }
  #content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .empty { padding: 24px 16px; color: var(--muted); text-align: center; line-height: 1.7; }
  .station-h {
    position: sticky; top: 0; z-index: 1;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--bg2); border-bottom: 1px solid var(--line);
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .station-h small { color: var(--muted); font-weight: 400; }
  .row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover, .row:active { background: var(--bg2); }
  .badge { min-width: 56px; text-align: center; background: var(--accent); color: var(--accent-text); font-weight: 700; border-radius: 8px; padding: 6px 8px; font-size: 15px; word-break: keep-all; }
  .row .mid { flex: 1; min-width: 0; }
  .row .t1 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t2 { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .eta { min-width: 64px; text-align: right; font-weight: 700; font-size: 15px; }
  .eta.soon { color: var(--soon); }
  .eta.ok { color: var(--ok); }
  .eta.dim { color: var(--muted); font-weight: 500; font-size: 13px; }
  .routehead { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--bg2); border-bottom: 1px solid var(--line); }
  .routehead .info { flex: 1; min-width: 0; }
  .routehead .t1 { font-weight: 700; }
  .routehead .t2 { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .dirs { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .dirs button { flex: 1; font-size: 13px; padding: 7px 8px; }
  .dirs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .stop { display: flex; gap: 12px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .stop:hover, .stop:active { background: var(--bg2); }
  .stop.near { background: rgba(26,115,232,.12); }
  .stop .no { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-text); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .stop .nm { flex: 1; font-size: 15px; min-width: 0; }
  .stop .nm small { display: block; color: var(--accent); font-size: 11px; }
  .stop .plate { font-size: 11px; color: var(--muted); display: block; text-align: right; font-weight: 400; }
  .num-icon { background: var(--accent); color: var(--accent-text); border: 2px solid #fff; border-radius: 50%; width: 24px; height: 24px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .num-icon.near { background: #e8710a; }
  .me-icon { width: 18px; height: 18px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(26,115,232,.3); }
  @media (min-width: 800px) {
    #app { flex-direction: row-reverse; }
    #map { flex: 1 1 auto; }
    #panel { flex: 0 0 420px; border-top: none; border-right: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <div class="toolbar">
      <button id="btnLocate" class="primary">📍 定位</button>
      <select id="radius" title="搜尋範圍">
        <option value="300">300 公尺</option>
        <option value="500" selected>500 公尺</option>
        <option value="800">800 公尺</option>
      </select>
      <button id="btnRefresh">🔄 更新</button>
      <button id="btnSettings">⚙ 設定</button>
    </div>
    <div id="settings">
      <label for="cid">TDX Client ID</label>
      <input id="cid" type="text" autocomplete="off" spellcheck="false">
      <label for="csec">TDX Client Secret</label>
      <input id="csec" type="password" autocomplete="off" spellcheck="false">
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center;">
        <button id="btnSave" class="primary">儲存</button>
        <span id="saveMsg" style="font-size:12px;color:var(--muted)"></span>
      </div>
      <div class="hint">金鑰只會存在這個瀏覽器的 localStorage，不會傳到 TDX 以外的地方。<br>申請網址：tdx.transportdata.tw（註冊後於會員中心建立 API 金鑰）。</div>
    </div>
    <div id="status">請先按右上「⚙ 設定」填入 TDX 金鑰，再按「📍 定位」。</div>
    <div id="content"><div class="empty">尚未查詢。<br>也可以直接點地圖任一位置來查詢該處附近的公車。</div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var BASE = "https://tdx.transportdata.tw/api/advanced/v2/Bus/";
  var TOKEN_URL = "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token";
  var REFRESH_MS = 20000;

  var map = L.map("map").setView([25.0478, 121.5170], 15);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者'
  }).addTo(map);

  var $ = function (id) { return document.getElementById(id); };
  var $status = $("status"), $content = $("content"), $radius = $("radius");
  var stationLayer = L.layerGroup().addTo(map);
  var routeLayer = L.layerGroup().addTo(map);

  var creds = { id: "", secret: "" };
  var tokenInfo = { value: "", exp: 0 };
  var userPos = null, userMarker = null, userCircle = null;
  var view = "list";          // list | route
  var token = 0;              // 取消過期請求用
  var listData = { stations: [], etas: [], routeInfo: {}, nearUids: {} };
  var routeState = null;
  var timer = null;

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function setStatus(msg, isErr) { $status.textContent = msg; $status.className = isErr ? "error" : ""; }
  function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function zh(o) { return o ? (o.Zh_tw || o.En || "") : ""; }
  function haversine(la1, lo1, la2, lo2) {
    var R = 6371000, r = Math.PI / 180;
    var dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
    var a = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function fmtTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  function etaInfo(e) {
    if (!e) return { t: "無資料", c: "dim", s: 999999 };
    var st = e.StopStatus;
    if (st === 0 && typeof e.EstimateTime === "number") {
      var sec = e.EstimateTime;
      if (sec <= 60) return { t: "進站中", c: "soon", s: sec };
      var m = Math.floor(sec / 60);
      return { t: m + " 分", c: m <= 3 ? "soon" : "ok", s: sec };
    }
    if (st === 1) {
      var nt = fmtTime(e.NextBusTime);
      return { t: nt ? "發車 " + nt : "尚未發車", c: "dim", s: 900000 };
    }
    if (st === 2) return { t: "不停靠", c: "dim", s: 950000 };
    if (st === 3) return { t: "末班已過", c: "dim", s: 960000 };
    if (st === 4) return { t: "今日未營運", c: "dim", s: 970000 };
    return { t: "無資料", c: "dim", s: 999999 };
  }

  /* ---------- TDX API ---------- */
  async function getToken(force) {
    if (!creds.id || !creds.secret) throw new Error("NOKEY");
    if (!force && tokenInfo.value && Date.now() < tokenInfo.exp) return tokenInfo.value;
    var body = new URLSearchParams();
    body.set("grant_type", "client_credentials");
    body.set("client_id", creds.id);
    body.set("client_secret", creds.secret);
    var res = await fetch(TOKEN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    });
    if (!res.ok) throw new Error("AUTH");
    var j = await res.json();
    tokenInfo.value = j.access_token;
    tokenInfo.exp = Date.now() + ((j.expires_in || 3600) - 60) * 1000;
    return tokenInfo.value;
  }

  async function api(path, params, retried) {
    var tk = await getToken(false);
    var qs = new URLSearchParams();
    qs.set("$format", "JSON");
    Object.keys(params || {}).forEach(function (k) { qs.set(k, params[k]); });
    var res = await fetch(BASE + path + "?" + qs.toString(), { headers: { Authorization: "Bearer " + tk } });
    if (res.status === 401 && !retried) { await getToken(true); return api(path, params, true); }
    if (res.status === 429) throw new Error("RATE");
    if (!res.ok) throw new Error("HTTP" + res.status);
    return res.json();
  }

  function errMsg(e) {
    var m = e && e.message;
    if (m === "NOKEY") return "請先在「⚙ 設定」填入 TDX Client ID 與 Secret。";
    if (m === "AUTH") return "TDX 金鑰驗證失敗，請檢查 Client ID / Secret 是否正確。";
    if (m === "RATE") return "請求太頻繁（TDX 限流），請稍候幾秒再試。";
    if (m && m.indexOf("HTTP") === 0) return "TDX 回應錯誤（" + m.slice(4) + "），請稍後再試。";
    return "連線失敗，請檢查網路後再試。";
  }

  function nearFilter(lat, lng, r) { return "nearby(" + lat + "," + lng + "," + r + ")"; }

  /* ---------- 定位 ---------- */
  function locate() {
    if (!navigator.geolocation) { setStatus("此瀏覽器不支援定位，請直接點地圖選擇位置。", true); return; }
    $("btnLocate").disabled = true;
    setStatus("定位中，請允許瀏覽器存取位置…");
    navigator.geolocation.getCurrentPosition(function (p) {
      $("btnLocate").disabled = false;
      setPosition(p.coords.latitude, p.coords.longitude, true);
    }, function (err) {
      $("btnLocate").disabled = false;
      var msg = "定位失敗，請直接點地圖選擇位置。";
      if (err.code === 1) msg = "定位被拒絕，請允許位置權限，或直接點地圖選擇位置。";
      else if (err.code === 3) msg = "定位逾時，請再試一次，或直接點地圖選擇位置。";
      setStatus(msg, true);
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  }

  function setPosition(lat, lng, zoom) {
    userPos = { lat: lat, lng: lng };
    var r = parseInt($radius.value, 10);
    if (userMarker) map.removeLayer(userMarker);
    if (userCircle) map.removeLayer(userCircle);
    userMarker = L.marker([lat, lng], {
      icon: L.divIcon({ className: "", html: '<div class="me-icon"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }),
      zIndexOffset: 1000
    }).addTo(map).bindPopup("目前位置");
    userCircle = L.circle([lat, lng], { radius: r, color: "#1a73e8", weight: 1, fillOpacity: 0.06 }).addTo(map);
    if (zoom) map.fitBounds(userCircle.getBounds(), { padding: [20, 20] });
    view = "list";
    routeLayer.clearLayers();
    loadNearby(true);
  }

  /* ---------- 附近站牌與公車 ---------- */
  async function loadNearby(full) {
    if (!userPos) return;
    var my = ++token;
    var r = parseInt($radius.value, 10);
    var sf = nearFilter(userPos.lat, userPos.lng, r);
    if (full) {
      setStatus("查詢附近站牌與公車中…");
      $content.innerHTML = '<div class="empty">載入中…</div>';
    }
    try {
      var tasks = [api("EstimatedTimeOfArrival/NearBy", { "$spatialFilter": sf })];
      if (full) {
        tasks.push(api("Station/NearBy", { "$spatialFilter": sf }));
        tasks.push(api("Route/NearBy", { "$spatialFilter": sf }));
      }
      var out = await Promise.all(tasks);
      if (my !== token) return;
      listData.etas = out[0] || [];
      if (full) {
        listData.stations = out[1] || [];
        var info = {};
        (out[2] || []).forEach(function (rt) {
          info[rt.RouteUID] = {
            dep: zh(rt.DepartureStopNameZh ? { Zh_tw: rt.DepartureStopNameZh } : null),
            dest: zh(rt.DestinationStopNameZh ? { Zh_tw: rt.DestinationStopNameZh } : null)
          };
        });
        listData.routeInfo = info;
        drawStationMarkers();
      }
      view = "list";
      renderList();
    } catch (e) {
      if (my !== token) return;
      setStatus(errMsg(e), true);
      if (full) $content.innerHTML = '<div class="empty">無法取得資料。<br>請確認金鑰設定後按「📍 定位」重試。</div>';
    }
  }

  function drawStationMarkers() {
    stationLayer.clearLayers();
    listData.stations.forEach(function (s) {
      var p = s.StationPosition;
      if (!p) return;
      L.circleMarker([p.PositionLat, p.PositionLon], {
        radius: 7, color: "#fff", weight: 2, fillColor: "#e8710a", fillOpacity: 1
      }).addTo(stationLayer).bindPopup("🚏 " + esc(zh(s.StationName)));
    });
  }

  function renderList() {
    if (view !== "list") return;
    // StopUID -> station
    var stopToStation = {};
    var stationMap = {};
    listData.stations.forEach(function (s, idx) {
      var key = "S" + idx;
      var d = s.StationPosition && userPos ? haversine(userPos.lat, userPos.lng, s.StationPosition.PositionLat, s.StationPosition.PositionLon) : 999999;
      stationMap[key] = { key: key, name: zh(s.StationName), lat: s.StationPosition ? s.StationPosition.PositionLat : null, lng: s.StationPosition ? s.StationPosition.PositionLon : null, dist: d, routes: {} };
      (s.Stops || []).forEach(function (st) { stopToStation[st.StopUID] = key; });
    });
    var near = {};
    listData.etas.forEach(function (e) {
      near[e.StopUID] = true;
      var key = stopToStation[e.StopUID];
      if (!key) {
        key = "N:" + zh(e.StopName);
        if (!stationMap[key]) stationMap[key] = { key: key, name: zh(e.StopName), lat: null, lng: null, dist: 999998, routes: {} };
      }
      var rk = e.RouteUID + "|" + e.Direction;
      var cur = stationMap[key].routes[rk];
      if (!cur || etaInfo(e).s < etaInfo(cur).s) stationMap[key].routes[rk] = e;
    });
    listData.nearUids = near;

    var list = Object.keys(stationMap).map(function (k) { return stationMap[k]; })
      .filter(function (s) { return Object.keys(s.routes).length > 0; })
      .sort(function (a, b) { return a.dist - b.dist; });

    var total = 0;
    list.forEach(function (s) { total += Object.keys(s.routes).length; });

    if (!list.length) {
      setStatus("附近沒有找到公車資料。");
      $content.innerHTML = '<div class="empty">這個範圍內沒有找到有公車經過的站牌。<br>可嘗試加大範圍或移動位置。</div>';
      return;
    }
    setStatus("附近 " + list.length + " 個站牌、" + total + " 班次，每 20 秒自動更新。");

    var html = "";
    var store = [];
    list.forEach(function (s, si) {
      html += '<div class="station-h" data-si="' + si + '"><span>🚏 ' + esc(s.name || "(未命名)") + '</span><small>' + (s.dist < 999990 ? Math.round(s.dist) + " 公尺" : "") + '</small></div>';
      var rows = Object.keys(s.routes).map(function (k) { return s.routes[k]; });
      rows.sort(function (a, b) {
        var d = etaInfo(a).s - etaInfo(b).s;
        if (d) return d;
        return zh(a.RouteName).localeCompare(zh(b.RouteName), "zh-Hant", { numeric: true });
      });
      rows.forEach(function (e) {
        var inf = etaInfo(e);
        var ri = listData.routeInfo[e.RouteUID] || {};
        var head = e.Direction === 1 ? ri.dep : ri.dest;
        var idx = store.length;
        store.push(e);
        html += '<div class="row" data-ei="' + idx + '"><div class="badge">' + esc(zh(e.RouteName)) + '</div>' +
          '<div class="mid"><div class="t1">' + (head ? "往 " + esc(head) : (e.Direction === 1 ? "返程" : "去程")) + '</div>' +
          '<div class="t2">' + (e.PlateNumb && e.PlateNumb !== "-1" ? "下一班車牌 " + esc(e.PlateNumb) : "點擊查看路線與站點") + '</div></div>' +
          '<div class="eta ' + inf.c + '">' + esc(inf.t) + '</div></div>';
      });
    });
    var st = $content.scrollTop;
    $content.innerHTML = html;
    $content.scrollTop = st;
    Array.prototype.forEach.call($content.querySelectorAll(".row"), function (el) {
      el.addEventListener("click", function () { showRoute(store[parseInt(el.getAttribute("data-ei"), 10)]); });
    });
    Array.prototype.forEach.call($content.querySelectorAll(".station-h"), function (el) {
      el.addEventListener("click", function () {
        var s = list[parseInt(el.getAttribute("data-si"), 10)];
        if (s && s.lat != null) map.flyTo([s.lat, s.lng], 18);
      });
    });
  }

  /* ---------- 路線詳情 ---------- */
  function parseWkt(w) {
    var pts = [], re = /(-?\d+\.?\d*)\s+(-?\d+\.?\d*)/g, m;
    while ((m = re.exec(w || "")) !== null) pts.push([parseFloat(m[2]), parseFloat(m[1])]);
    return pts;
  }

  async function nearOrFilter(path, routeUID, sf) {
    var f = "RouteUID eq '" + routeUID + "'";
    try {
      return await api(path, { "$spatialFilter": sf, "$filter": f });
    } catch (e) {
      if (e.message === "AUTH" || e.message === "NOKEY" || e.message === "RATE") throw e;
      var all = await api(path, { "$spatialFilter": sf });
      return (all || []).filter(function (x) { return x.RouteUID === routeUID; });
    }
  }

  async function showRoute(e) {
    var my = ++token;
    view = "route";
    var rname = zh(e.RouteName);
    setStatus("載入路線 " + rname + " 中…");
    try {
      var sf = nearFilter(userPos.lat, userPos.lng, parseInt($radius.value, 10));
      var res = await Promise.all([
        nearOrFilter("StopOfRoute/NearBy", e.RouteUID, sf),
        nearOrFilter("Shape/NearBy", e.RouteUID, sf)
      ]);
      if (my !== token) return;
      var sor = res[0] || [], shapes = res[1] || [];
      if (!sor.length) throw new Error("EMPTY");
      routeState = {
        routeUID: e.RouteUID, name: rname, dir: e.Direction, stopUID: e.StopUID,
        sor: sor, shapes: shapes, city: sor[0].City || "", etas: [], plates: {}
      };
      drawRoute();
      await refreshRouteEta(my);
    } catch (err) {
      if (my !== token) return;
      view = "list";
      setStatus(err.message === "EMPTY" ? "查不到這條路線的站點資料。" : errMsg(err), true);
    }
  }

  function pickEntry(dir) {
    var cands = routeState.sor.filter(function (x) { return x.Direction === dir; });
    if (!cands.length) return null;
    var hit = cands.filter(function (x) {
      return (x.Stops || []).some(function (s) { return s.StopUID === routeState.stopUID; });
    });
    return (hit[0] || cands[0]);
  }

  function drawRoute() {
    var rs = routeState;
    var entry = pickEntry(rs.dir);
    if (!entry) {
      var other = rs.dir === 0 ? 1 : 0;
      if (pickEntry(other)) { rs.dir = other; entry = pickEntry(other); }
    }
    routeLayer.clearLayers();
    map.removeLayer(stationLayer);
    var bounds = L.latLngBounds([]);

    var sh = rs.shapes.filter(function (x) { return x.Direction === rs.dir; });
    var shPick = sh.filter(function (x) { return entry && x.SubRouteUID === entry.SubRouteUID; })[0] || sh[0];
    if (shPick && shPick.Geometry) {
      var pts = parseWkt(shPick.Geometry);
      if (pts.length > 1) {
        L.polyline(pts, { color: "#1a73e8", weight: 5, opacity: 0.8 }).addTo(routeLayer);
        pts.forEach(function (p) { bounds.extend(p); });
      }
    }

    rs.stops = [];
    if (entry) {
      var stops = (entry.Stops || []).slice().sort(function (a, b) { return a.StopSequence - b.StopSequence; });
      stops.forEach(function (s, i) {
        var p = s.StopPosition;
        var isNear = !!listData.nearUids[s.StopUID];
        var obj = { uid: s.StopUID, name: zh(s.StopName), seq: s.StopSequence, near: isNear, lat: p ? p.PositionLat : null, lng: p ? p.PositionLon : null };
        if (p) {
          obj.marker = L.marker([p.PositionLat, p.PositionLon], {
            icon: L.divIcon({ className: "", html: '<div class="num-icon' + (isNear ? " near" : "") + '">' + (i + 1) + '</div>', iconSize: [24, 24], iconAnchor: [12, 12] })
          }).addTo(routeLayer).bindPopup("<b>" + (i + 1) + ".</b> " + esc(obj.name));
          bounds.extend([p.PositionLat, p.PositionLon]);
        }
        rs.stops.push(obj);
      });
      rs.head = zh(entry.RouteName) ? "" : "";
    }
    if (userPos) bounds.extend([userPos.lat, userPos.lng]);
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30] });
    renderRoute();
  }

  async function refreshRouteEta(my) {
    var rs = routeState;
    if (!rs) return;
    try {
      var data;
      var f = "RouteUID eq '" + rs.routeUID + "'";
      if (rs.city) data = await api("EstimatedTimeOfArrival/City/" + encodeURIComponent(rs.city) + "/" + encodeURIComponent(rs.name), { "$filter": f });
      else data = await api("EstimatedTimeOfArrival/InterCity/" + encodeURIComponent(rs.name), { "$filter": f });
      if (my != null && my !== token) return;
      if (view !== "route") return;
      rs.etas = data || [];
      renderRoute();
    } catch (e) {
      if (view === "route") setStatus(errMsg(e), true);
    }
  }

  function renderRoute() {
    if (view !== "route" || !routeState) return;
    var rs = routeState;
    var etaMap = {};
    rs.etas.forEach(function (e) { if (e.Direction === rs.dir) etaMap[e.StopUID] = e; });

    var dirs = {};
    rs.sor.forEach(function (x) {
      if (!dirs[x.Direction]) {
        var stops = x.Stops || [];
        var last = stops.length ? stops.slice().sort(function (a, b) { return a.StopSequence - b.StopSequence; })[stops.length - 1] : null;
        dirs[x.Direction] = last ? zh(last.StopName) : "";
      }
    });

    var html = '<div class="routehead"><button id="btnBack">← 返回</button><div class="info"><div class="t1">' +
      esc(rs.name) + ' 路</div><div class="t2">' + (dirs[rs.dir] ? "往 " + esc(dirs[rs.dir]) : "") + '</div></div></div>';
    var dk = Object.keys(dirs);
    if (dk.length > 1) {
      html += '<div class="dirs">';
      dk.forEach(function (d) {
        html += '<button data-d="' + d + '" class="' + (parseInt(d, 10) === rs.dir ? "on" : "") + '">往 ' + esc(dirs[d] || (d === "1" ? "返程" : "去程")) + '</button>';
      });
      html += '</div>';
    }
    if (!rs.stops.length) {
      html += '<div class="empty">這個方向沒有站點資料。</div>';
    } else {
      rs.stops.forEach(function (s, i) {
        var inf = etaInfo(etaMap[s.uid]);
        var e = etaMap[s.uid];
        html += '<div class="stop' + (s.near ? " near" : "") + '" data-i="' + i + '"><div class="no">' + (i + 1) + '</div>' +
          '<div class="nm">' + esc(s.name) + (s.near ? "<small>📍 附近站牌</small>" : "") + '</div>' +
          '<div class="eta ' + inf.c + '">' + esc(inf.t) +
          (e && e.PlateNumb && e.PlateNumb !== "-1" && e.StopStatus === 0 && e.EstimateTime <= 180 ? '<span class="plate">' + esc(e.PlateNumb) + '</span>' : "") +
          '</div></div>';
      });
    }
    var st = $content.scrollTop;
    $content.innerHTML = html;
    $content.scrollTop = st;
    setStatus("路線 " + rs.name + "：共 " + rs.stops.length + " 站，每 20 秒自動更新。");

    $("btnBack").addEventListener("click", backToList);
    Array.prototype.forEach.call($content.querySelectorAll(".dirs button"), function (b) {
      b.addEventListener("click", function () {
        rs.dir = parseInt(b.getAttribute("data-d"), 10);
        $content.scrollTop = 0;
        drawRoute();
      });
    });
    Array.prototype.forEach.call($content.querySelectorAll(".stop"), function (el) {
      el.addEventListener("click", function () {
        var s = rs.stops[parseInt(el.getAttribute("data-i"), 10)];
        if (s && s.lat != null) {
          map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 17));
          if (s.marker) s.marker.openPopup();
        }
      });
    });
  }

  function backToList() {
    token++;
    view = "list";
    routeState = null;
    routeLayer.clearLayers();
    if (!map.hasLayer(stationLayer)) map.addLayer(stationLayer);
    if (userCircle) map.fitBounds(userCircle.getBounds(), { padding: [20, 20] });
    $content.scrollTop = 0;
    renderList();
    loadNearby(false);
  }

  /* ---------- 自動更新 ---------- */
  function tick() {
    if (document.hidden || !userPos) return;
    if (view === "list") loadNearby(false);
    else if (view === "route") refreshRouteEta(token);
  }
  timer = setInterval(tick, REFRESH_MS);

  /* ---------- 事件 ---------- */
  function loadCreds() { creds.id = lsGet("tdx_id"); creds.secret = lsGet("tdx_secret"); $("cid").value = creds.id; $("csec").value = creds.secret; }
  loadCreds();
  if (!creds.id || !creds.secret) $("settings").className = "open";

  $("btnSettings").addEventListener("click", function () {
    $("settings").className = $("settings").className === "open" ? "" : "open";
  });
  $("btnSave").addEventListener("click", function () {
    creds.id = $("cid").value.trim();
    creds.secret = $("csec").value.trim();
    tokenInfo = { value: "", exp: 0 };
    var ok = lsSet("tdx_id", creds.id) && lsSet("tdx_secret", creds.secret);
    $("saveMsg").textContent = ok ? "已儲存" : "已套用（此瀏覽器無法永久儲存）";
    if (creds.id && creds.secret) {
      $("settings").className = "";
      setStatus("金鑰已設定，請按「📍 定位」開始。");
    }
  });
  $("btnLocate").addEventListener("click", locate);
  $("btnRefresh").addEventListener("click", function () {
    if (!userPos) { locate(); return; }
    if (view === "route") refreshRouteEta(token); else loadNearby(true);
  });
  $radius.addEventListener("change", function () { if (userPos) setPosition(userPos.lat, userPos.lng, true); });
  map.on("click", function (ev) { setPosition(ev.latlng.lat, ev.latlng.lng, false); });
})();
</script>
</body>
</html>
